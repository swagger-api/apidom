  /acme/status:
    get:
      tags:
      - acme
      summary: Get Status.
      description: Returns a Status object.
      operationId: getStatus
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: ./json-schema-2020-12.yaml#/$defs/Status
        default:
