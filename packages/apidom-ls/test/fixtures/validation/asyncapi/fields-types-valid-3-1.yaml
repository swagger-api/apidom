asyncapi: 3.1.0
info:
  title: Sample AsyncAPI
  version: '1.0.0'
  tags:
    - name: info-tag
servers:
  server1:
    host: example.com
    protocol: mqtt
    pathname: /v1
    title: Server
    summary: Server summary
channels:
  channel1:
    address: users/signedup
    title: Channel
    summary: Channel summary
    servers: []
    messages:
      message1:
        $ref: '#/components/messages/message1'
    tags:
      - name: channel-tag
    externalDocs:
      url: https://example.com/docs
  channel2:
    address: null
    messages:
      message1:
        $ref: '#/components/messages/message1'
components:
  messages:
    message1:
      name: message1
  replies:
    reply1:
      channel:
        $ref: '#/channels/channel1'
  replyAddresses:
    replyAddress1:
      location: $message.header#/replyTo
  tags:
    tag1:
      name: component-tag
    tag2:
      $ref: '#/components/tags/tag1'
  externalDocs:
    externalDocs1:
      url: https://example.com/docs
  securitySchemes:
    securityScheme1:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
      scopes:
        - read
        - write
    securityScheme2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/auth
          tokenUrl: https://example.com/token
          availableScopes:
            read: Read access
  operationTraits:
    trait1:
      title: Trait
