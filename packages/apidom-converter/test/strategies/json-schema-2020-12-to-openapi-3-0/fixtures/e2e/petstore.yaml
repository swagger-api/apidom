  /acme/category:
    get:
      tags:
      - acme
      summary: Get Category.
      description: Returns a Category object.
      operationId: getCategory
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: ./json-schema-2020-12.yaml#/$defs/Category
        default:
