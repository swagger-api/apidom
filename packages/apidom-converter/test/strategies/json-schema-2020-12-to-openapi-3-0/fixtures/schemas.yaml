$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas
$defs:
  Pet:
    type: object
    properties:
      id:
        type: integer
        examples: [10]
      category:
        $ref: '#/$defs/Category'
      tag:
        $ref: '#tag'
    if:
      properties:
        status:
          const: available
    then:
      required: [category]
  Category:
    type: [object, 'null']
    properties:
      name:
        type: string
  Tag:
    $anchor: tag
    type: string
