asyncapi: 3.0.0
info:
  title: Sample AsyncAPI
  version: '1.0.0'
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/auth
          tokenUrl: https://example.com/token
          availableScopes:
            read: Read access
          x-custom-extension: allowed
        implicit:
          authorizationUrl: https://example.com/auth
          tokenUrl: https://example.com/token
          availableScopes:
            read: Read access
          scopes:
            read: Read access
